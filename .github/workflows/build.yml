name: Test e build

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]  # pubblicando una Release si compilano e allegano installer e zip
  workflow_dispatch:
    inputs:
      release:
        description: "Versione da pubblicare come Release (es. 0.3.0). Vuoto = solo build"
        required: false
        default: ""

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-github-actions-annotate-failures
      - run: python -m pytest -v tests

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write  # serve per creare la Release quando si pubblica un tag
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm savesync.spec
      - name: Smoke test dell'exe (deve partire e restare vivo)
        shell: pwsh
        run: |
          $env:SAVESYNC_HOME = "$env:RUNNER_TEMP\savesync-home"
          $p = Start-Process dist\SaveSync\SaveSync.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "SaveSync.exe si e' chiuso subito (codice $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
      - name: Installer
        shell: pwsh
        run: |
          $env:SAVESYNC_VERSION = "${{ github.event.release.tag_name || inputs.release || '0.3.0' }}".TrimStart("v")
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
      - run: Compress-Archive -Path dist\SaveSync -DestinationPath dist\SaveSync-portable.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: SaveSync-windows
          path: |
            dist/SaveSync-Setup-*.exe
            dist/SaveSync-portable.zip
      - if: github.event_name == 'release' || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || format('v{0}', inputs.release) }}
          name: SaveSync ${{ github.event.release.tag_name || format('v{0}', inputs.release) }}
          target_commitish: ${{ github.sha }}

          body: |
            **Download:** `SaveSync-Setup-*.exe` (installer, consigliato) oppure `SaveSync-portable.zip`.

            Windows mostrerà "Windows ha protetto il PC" perché l'exe non è firmato:
            *Ulteriori informazioni > Esegui comunque*.

            Guida passo passo: [SETUP.md](https://github.com/${{ github.repository }}/blob/main/SETUP.md)
          generate_release_notes: true
          files: |
            dist/SaveSync-Setup-*.exe
            dist/SaveSync-portable.zip
