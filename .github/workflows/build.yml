name: Test e build

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]  # pubblicando una Release si compilano e allegano installer e zip
  workflow_dispatch:
    inputs:
      release:
        description: "Versione da pubblicare come Release (es. 0.5.0). Vuoto = solo build"
        required: false
        default: ""

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-github-actions-annotate-failures
      - run: python -m pytest -v tests

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Versione
        shell: pwsh
        run: |
          # pubblicando una release, la versione scelta finisce dentro l'exe (serve
          # all'aggiornamento automatico); altrimenti vale quella in savesync/__init__.py
          $v = "${{ github.event.release.tag_name || inputs.release }}".TrimStart("v")
          if ($v) { Set-Content savesync/__init__.py "__version__ = `"$v`"" }
          $v = (Select-String -Path savesync/__init__.py -Pattern '"([^"]+)"').Matches[0].Groups[1].Value
          "SAVESYNC_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Versione: $v"
      - run: pyinstaller --noconfirm savesync.spec
      - name: Smoke test dell'exe (deve partire e restare vivo)
        shell: pwsh
        run: |
          $env:SAVESYNC_HOME = "$env:RUNNER_TEMP\savesync-home"
          $p = Start-Process dist\SaveSync\SaveSync.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "SaveSync.exe si e' chiuso subito (codice $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
      - run: Compress-Archive -Path dist\SaveSync -DestinationPath dist\SaveSync-portable.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: SaveSync-windows
          path: |
            dist/SaveSync-Setup-*.exe
            dist/SaveSync-portable.zip

  linux:
    needs: test
    runs-on: ubuntu-22.04  # glibc vecchia = l'eseguibile gira anche su SteamOS e distro recenti
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: pip install -r requirements.txt pyinstaller
      - name: Versione
        run: |
          v="${{ github.event.release.tag_name || inputs.release }}"; v="${v#v}"
          if [ -n "$v" ]; then echo "__version__ = \"$v\"" > savesync/__init__.py; fi
          v=$(python -c "import savesync; print(savesync.__version__)")
          echo "SAVESYNC_VERSION=$v" >> "$GITHUB_ENV"; echo "Versione: $v"
      - run: pyinstaller --noconfirm savesync.spec
      - name: Smoke test (versione, servizio, finestra)
        run: |
          export SAVESYNC_HOME="$RUNNER_TEMP/savesync-home"
          dist/SaveSync/SaveSync --version
          rc=0; timeout 30 dist/SaveSync/SaveSync --service || rc=$?
          test "$rc" -eq 2  # non configurato: deve uscire con 2, non andare in crash
          xvfb-run -a sh -c 'dist/SaveSync/SaveSync & pid=$!; sleep 15; kill -0 $pid && kill $pid'
      - name: Pacchetto per Steam Deck / Linux
        run: |
          cp install-steamdeck.sh assets/icon.png dist/SaveSync/
          tar -C dist -czf dist/SaveSync-linux-x86_64.tar.gz SaveSync
      - uses: actions/upload-artifact@v4
        with:
          name: SaveSync-linux
          path: dist/SaveSync-linux-x86_64.tar.gz

  release:
    if: github.event_name == 'release' || inputs.release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # serve per creare la Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || format('v{0}', inputs.release) }}
          name: SaveSync ${{ github.event.release.tag_name || format('v{0}', inputs.release) }}
          target_commitish: ${{ github.sha }}
          body: |
            **Windows:** `SaveSync-Setup-*.exe` (installer, consigliato) oppure `SaveSync-portable.zip`.
            Windows mostrerà "Windows ha protetto il PC" perché l'exe non è firmato:
            *Ulteriori informazioni > Esegui comunque*.

            **Steam Deck / Linux:** `SaveSync-linux-x86_64.tar.gz`, istruzioni in
            [STEAMDECK.md](https://github.com/${{ github.repository }}/blob/main/STEAMDECK.md).

            Guida passo passo: [SETUP.md](https://github.com/${{ github.repository }}/blob/main/SETUP.md)
          generate_release_notes: true
          files: |
            dist/SaveSync-Setup-*.exe
            dist/SaveSync-portable.zip
            dist/SaveSync-linux-x86_64.tar.gz
