name: Test e build

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]  # pubblicando una Release si compilano e allegano installer e zip
  workflow_dispatch:
    inputs:
      release:
        description: "Versione da pubblicare come Release (es. 0.5.2). Vuoto = solo build"
        required: false
        default: ""

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]  # i tuoi sistemi: Windows e Steam Deck (Linux)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-timeout pytest-github-actions-annotate-failures
      - name: rclone (per i test del backend rclone; senza, quei test si saltano)
        continue-on-error: true
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then choco install rclone -y --no-progress
          else sudo apt-get install -y rclone; fi
      - run: python -m pytest -v --timeout=600 tests --ignore=tests/test_gui_smoke.py
        env:
          # le simulazioni sono lente sul disco dei runner Windows: lì ne bastano poche
          SIM_SEEDS: ${{ runner.os == 'Windows' && '3' || '8' }}
          SIM_SEEDS_MULTI: ${{ runner.os == 'Windows' && '2' || '6' }}
          SIM_SEEDS_LONG: ${{ runner.os == 'Windows' && '1' || '2' }}
          SIM_SEEDS_DELETE: ${{ runner.os == 'Windows' && '2' || '4' }}
          SIM_SEEDS_DELETE_MULTI: ${{ runner.os == 'Windows' && '1' || '2' }}
          SIM_SEEDS_MIXED: ${{ runner.os == 'Windows' && '1' || '3' }}
          # tre dispositivi: stessa logica su ogni sistema, e sui dischi lenti di Windows
          # superano i 10 minuti per test. Solo su Linux
          SIM_SEEDS_THREE: ${{ runner.os == 'Windows' && '0' || '2' }}
      # La prova dell'interfaccia gira in un processo a parte: apre l'app vera e niente di quello
      # che lascia (thread, Tk) deve poter disturbare gli altri test
      - name: Prova dell'interfaccia (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -v --timeout=300 tests/test_gui_smoke.py
      - name: Prova dell'interfaccia con un display virtuale (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a python -m pytest -v --timeout=300 tests/test_gui_smoke.py

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Versione
        shell: pwsh
        run: |
          # pubblicando una release, la versione scelta finisce dentro l'exe (serve
          # all'aggiornamento automatico); altrimenti vale quella in resosync/__init__.py
          $v = "${{ github.event.release.tag_name || inputs.release }}".TrimStart("v")
          if ($v) { Set-Content resosync/__init__.py "__version__ = `"$v`"" }
          $v = (Select-String -Path resosync/__init__.py -Pattern '"([^"]+)"').Matches[0].Groups[1].Value
          "RESOSYNC_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Versione: $v"
      - run: pyinstaller --noconfirm resosync.spec
      - name: Smoke test dell'exe (deve partire e restare vivo)
        shell: pwsh
        run: |
          $env:RESOSYNC_HOME = "$env:RUNNER_TEMP\resosync-home"
          $p = Start-Process dist\ResoSync\ResoSync.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "ResoSync.exe si e' chiuso subito (codice $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
      - run: Compress-Archive -Path dist\ResoSync -DestinationPath dist\ResoSync-portable.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: ResoSync-windows
          path: |
            dist/ResoSync-Setup-*.exe
            dist/ResoSync-portable.zip

  linux:
    needs: test
    runs-on: ubuntu-22.04  # glibc vecchia = l'eseguibile gira anche su SteamOS e distro recenti
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: pip install -r requirements.txt pyinstaller
      - name: Versione
        run: |
          v="${{ github.event.release.tag_name || inputs.release }}"; v="${v#v}"
          if [ -n "$v" ]; then echo "__version__ = \"$v\"" > resosync/__init__.py; fi
          v=$(python -c "import resosync; print(resosync.__version__)")
          echo "RESOSYNC_VERSION=$v" >> "$GITHUB_ENV"; echo "Versione: $v"
      - run: pyinstaller --noconfirm resosync.spec
      - name: Smoke test (versione, servizio, finestra)
        run: |
          export RESOSYNC_HOME="$RUNNER_TEMP/resosync-home"
          dist/ResoSync/ResoSync --version
          rc=0; timeout 30 dist/ResoSync/ResoSync --service || rc=$?
          test "$rc" -eq 2  # non configurato: deve uscire con 2, non andare in crash
          xvfb-run -a sh -c 'dist/ResoSync/ResoSync & pid=$!; sleep 15; kill -0 $pid && kill $pid'
      - name: Pacchetto per Steam Deck / Linux
        run: |
          cp install-steamdeck.sh assets/icon.png dist/ResoSync/
          tar -C dist -czf dist/ResoSync-linux-x86_64.tar.gz ResoSync
      - uses: actions/upload-artifact@v4
        with:
          name: ResoSync-linux
          path: dist/ResoSync-linux-x86_64.tar.gz

  release:
    if: github.event_name == 'release' || inputs.release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # serve per creare la Release
    steps:
      - uses: actions/checkout@v5
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Note della versione (dal CHANGELOG)
        run: |
          v="${{ github.event.release.tag_name || inputs.release }}"; v="${v#v}"
          {
            echo "## Novità"
            awk -v v="$v" 'index($0, "## " v) == 1 && (length($0) == length("## " v) ||
                 substr($0, length("## " v) + 1, 1) ~ /[ (,]/) {p=1; next}
                 p && /^## / {exit} p' src/CHANGELOG.md
            echo
            echo "## Download"
            echo
            echo '**Windows:** `ResoSync-Setup-*.exe` (installer, consigliato) oppure `ResoSync-portable.zip`.'
            echo '(`SaveSync-Setup-*.exe` è lo stesso file: serve solo all'"'"'aggiornamento automatico di'
            echo 'chi ha ancora SaveSync, il vecchio nome del progetto.)'
            echo 'Windows mostrerà "Windows ha protetto il PC" perché l'"'"'exe non è firmato:'
            echo '*Ulteriori informazioni > Esegui comunque*.'
            echo
            echo '**Steam Deck / Linux:** `ResoSync-linux-x86_64.tar.gz`, istruzioni in'
            echo "[STEAMDECK.md](https://github.com/${{ github.repository }}/blob/main/STEAMDECK.md)."
            echo
            echo "Guida passo passo: [SETUP.md](https://github.com/${{ github.repository }}/blob/main/SETUP.md)"
          } > notes.md
          cat notes.md
      - name: Copia dell'installer col vecchio nome (aggiornamento automatico da SaveSync 0.4.0)
        run: |
          for f in dist/ResoSync-Setup-*.exe; do cp "$f" "dist/SaveSync-Setup-${f#dist/ResoSync-Setup-}"; done
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || format('v{0}', inputs.release) }}
          name: ResoSync ${{ github.event.release.tag_name || format('v{0}', inputs.release) }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          generate_release_notes: true
          files: |
            dist/ResoSync-Setup-*.exe
            dist/SaveSync-Setup-*.exe
            dist/ResoSync-portable.zip
            dist/ResoSync-linux-x86_64.tar.gz
